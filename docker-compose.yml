services:
  db:
    image: postgres:16-alpine
    container_name: uatdesk-db
    environment:
      POSTGRES_USER: uat
      POSTGRES_PASSWORD: uat
      POSTGRES_DB: uatdesk
    ports:
      - "5432:5432"
    volumes:
      - uatdesk_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uat -d uatdesk"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: ./server
    container_name: uatdesk-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      DATABASE_URL: postgres://uat:uat@db:5432/uatdesk
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@uatdesk.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-now}
      MAIL_FROM: ${MAIL_FROM:-UAT Desk <no-reply@uatdesk.local>}
      SMTP_URL: ${SMTP_URL:-}
      STORAGE_DRIVER: local
      STORAGE_DIR: /data/storage
      TRUST_PROXY: ${TRUST_PROXY:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - uatdesk_storage:/data/storage

  # Optional S3-compatible object storage. Start with: docker compose --profile s3 up -d
  minio:
    image: minio/minio:latest
    container_name: uatdesk-minio
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - uatdesk_minio:/data

volumes:
  uatdesk_pg:
  uatdesk_minio:
  uatdesk_storage:
