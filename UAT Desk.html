<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UAT Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=JetBrains+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F5F2; --surface:#FFFFFF; --sunk:#E9ECE7; --ink:#16201B; --muted:#58625D; --line:#D6DBD4; --line-strong:#B6BEB5;
  --brand:#1E5B4A; --brand-ink:#FFFFFF; --brand-soft:#DDEDE6;
  --pass:#1E7A50; --pass-soft:#DFF1E7; --fail:#B42318; --fail-soft:#FBE6E3;
  --retest:#8F5505; --retest-soft:#FAEED8; --na:#5F6670; --na-soft:#E8EAED;
  --focus:#2F6FEB; --overlay:rgba(16,24,20,.5); --sig-bg:#FFFFFF; --sig-ink:#1A2A5A;
  --sans:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --hand:"Caveat", "Segoe Script", "Bradley Hand", cursive;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101513; --surface:#18201C; --sunk:#0C110F; --ink:#E5ECE8; --muted:#9BA6A0; --line:#2B3530; --line-strong:#3E4A44;
    --brand:#62BC9C; --brand-ink:#0B1A14; --brand-soft:#1B3128;
    --pass:#5EC28E; --pass-soft:#16301F; --fail:#F2867B; --fail-soft:#3A1B17;
    --retest:#E6AA52; --retest-soft:#352812; --na:#A3AAB3; --na-soft:#262B2F;
    --focus:#7AA7FF; --overlay:rgba(0,0,0,.62);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#101513; --surface:#18201C; --sunk:#0C110F; --ink:#E5ECE8; --muted:#9BA6A0; --line:#2B3530; --line-strong:#3E4A44;
  --brand:#62BC9C; --brand-ink:#0B1A14; --brand-soft:#1B3128;
  --pass:#5EC28E; --pass-soft:#16301F; --fail:#F2867B; --fail-soft:#3A1B17;
  --retest:#E6AA52; --retest-soft:#352812; --na:#A3AAB3; --na-soft:#262B2F;
  --focus:#7AA7FF; --overlay:rgba(0,0,0,.62);
  color-scheme: dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
img{max-width:100%}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1280px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand svg{flex:none}
.brand small{font-weight:500;color:var(--muted);font-size:13px;letter-spacing:0}
.switch{display:inline-flex;border:1px solid var(--line-strong);border-radius:9px;padding:3px;background:var(--sunk);margin-left:auto}
.switch button{border:0;background:transparent;font:600 14px var(--sans);color:var(--muted);padding:6px 14px;border-radius:6px;cursor:pointer}
.switch button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}

/* buttons and fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 14px/1.1 var(--sans);padding:9px 14px;border-radius:7px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;min-height:38px}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08);background:var(--brand)}
.btn.danger{color:var(--fail);border-color:var(--fail)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{padding:5px 10px;min-height:30px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:disabled:hover{background:var(--surface)}
.btn.primary:disabled:hover{background:var(--brand);filter:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:grid;gap:6px;margin-bottom:14px}
.lbl{font-weight:600;font-size:14px}
.hint{font-size:13px;color:var(--muted);margin:0}
input[type=text],input[type=email],input[type=password],input[type=date],select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:7px;padding:9px 11px;width:100%}
textarea{min-height:60px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--focus)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;align-items:start}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--brand);flex:none}

/* layout */
.wrap{max-width:1280px;margin:0 auto;padding:26px 20px 56px}
.company{display:grid;grid-template-columns:232px minmax(0,1fr);gap:30px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start}
.navbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:7px;font:500 14px var(--sans);color:var(--ink);cursor:pointer}
.navbtn:hover{background:var(--sunk)}
.navbtn[aria-current]{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-weight:600}
.navbtn.sub{font-size:13.5px;color:var(--muted)}
.navbtn.sub[aria-current]{color:var(--ink)}
.group-label{font-size:12.5px;color:var(--muted);font-weight:600;margin:20px 10px 4px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--line-strong)}
.dot.d-signed,.dot.d-ready{background:var(--pass)} .dot.d-fail{background:var(--fail)} .dot.d-progress{background:var(--brand)}
h1{font-size:28px;line-height:1.15;letter-spacing:-.02em;margin:0 0 6px;font-weight:700}
h2{font-size:19px;line-height:1.25;letter-spacing:-.01em;margin:0}
h3{font-size:16px;line-height:1.3;margin:0}
.lede{color:var(--muted);margin:0 0 22px;max-width:64ch}
.sub{font-size:12.5px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:22px}
.panel > h2{margin-bottom:12px}
.backlink{margin:0 0 10px -10px}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.foot{margin-top:40px;color:var(--muted);font-size:13px}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:20px}
.stat{padding:14px 18px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat b{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{color:var(--muted);font-size:13px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.toolbar select{width:auto;min-width:200px}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.rowlink{cursor:pointer}
tr.rowlink:hover td{background:var(--sunk)}
.linklike{border:0;background:none;padding:0;font:600 14px var(--sans);color:var(--ink);cursor:pointer;text-align:left}
.linklike:hover{text-decoration:underline}
.progress{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;min-width:100px;margin:6px 0 4px}
.progress i{display:block;height:100%;background:var(--brand);border-radius:99px}
.progress.big{height:8px;min-width:220px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;background:var(--na-soft);color:var(--na)}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.b-pass{background:var(--pass-soft);color:var(--pass)}
.b-fail{background:var(--fail-soft);color:var(--fail)}
.b-retest{background:var(--retest-soft);color:var(--retest)}
.b-brand{background:var(--brand-soft);color:var(--brand)}
.mono{font-family:var(--mono);font-size:.9em}
.err{color:var(--fail);font-size:13.5px;font-weight:500;margin:8px 0 0}
.errors{background:var(--fail-soft);border-radius:8px;padding:12px 14px;color:var(--fail);font-size:14px;margin:12px 0}
.errors ul{margin:6px 0 0;padding-left:18px}
.notice{background:var(--retest-soft);color:var(--retest);border-radius:8px;padding:12px 14px;font-size:14px;margin:12px 0}
.ok{background:var(--pass-soft);color:var(--pass);border-radius:8px;padding:12px 14px;font-size:14px;margin:12px 0}
.empty{text-align:center;padding:48px 20px;border:1px dashed var(--line-strong);border-radius:10px;color:var(--muted)}
.empty h2{color:var(--ink);margin-bottom:6px}

/* credentials */
.cred{border:2px solid var(--brand);border-radius:10px;padding:18px 20px;background:var(--brand-soft);margin-bottom:22px}
.cred p{margin:6px 0 0;max-width:70ch}
.cred dl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 14px;align-items:center;margin:14px 0}
.cred dt{color:var(--muted);font-size:13px;font-weight:600}
.cred dd{margin:0;font-family:var(--mono);font-size:14.5px;word-break:break-all}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px 16px;align-items:center}
.kv dt{color:var(--muted);font-size:13.5px;font-weight:600}
.kv dd{margin:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
.kv dd .mono{word-break:break-all}
.kv input[type=date]{width:auto}

/* milestone sections (company) */
.ms-block{margin-bottom:26px}
.ms-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.ms-num{font-size:13px;font-weight:600;color:var(--muted)}
.thumb{width:72px;height:48px;object-fit:cover;border-radius:5px;border:1px solid var(--line);cursor:zoom-in;padding:0;background:var(--sunk);display:block}
.thumb-btn{border:0;padding:0;background:none;cursor:zoom-in}
.log{list-style:none;margin:0;padding:0;font-size:14px}
.log li{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.log li:last-child{border-bottom:0}
.log time{color:var(--muted);font-size:13px}

/* new project */
.mspreview{margin:10px 0 0;padding-left:22px}
.mspreview li{margin:4px 0}

/* client */
.login{max-width:460px;margin:30px auto}
.demo-creds{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
.demo-creds ul{list-style:none;margin:8px 0 0;padding:0}
.demo-creds li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.demo-creds li:last-child{border-bottom:0}
.portal-head{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end;justify-content:space-between;margin-bottom:24px}
.portal{display:grid;grid-template-columns:290px minmax(0,1fr);gap:30px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start}
.rail ol{list-style:none;margin:0;padding:0}
.rail li{position:relative}
.rail li:not(:last-child)::after{content:"";position:absolute;left:23px;top:42px;bottom:-4px;width:2px;background:var(--line)}
.rail li.complete:not(:last-child)::after{background:var(--brand)}
.step{display:flex;gap:12px;width:100%;text-align:left;background:transparent;border:0;padding:8px;border-radius:9px;cursor:pointer;color:inherit;font:inherit;margin-bottom:6px;position:relative;z-index:1}
.step:hover:not(:disabled){background:var(--sunk)}
.step[aria-current="step"]{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.step:disabled{cursor:not-allowed}
.step:disabled .t{color:var(--muted)}
.node{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;border:2px solid var(--line-strong);background:var(--surface);color:var(--muted);margin-left:1px}
.complete .node{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);box-shadow:0 0 0 3px var(--paper),0 0 0 4.5px var(--brand)}
.open .node{border-color:var(--brand);color:var(--brand)}
.step .t{font-weight:600;line-height:1.3;display:block}
.step .s{font-size:12.5px;color:var(--muted);display:block;margin-top:2px}
.submit-box{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
.submit-box .hint{margin-top:8px}
.ms-title{margin-bottom:16px}
.ms-title p{margin:4px 0 0;color:var(--muted);font-size:14px}

.item{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line-strong);border-radius:10px;padding:16px 18px;margin-bottom:12px}
.item.s-pass{border-left-color:var(--pass)}
.item.s-fail{border-left-color:var(--fail)}
.item.s-retest{border-left-color:var(--retest)}
.item.s-na{border-left-color:var(--na)}
.item-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.item-top h3{font-size:16px}
.code{font-family:var(--mono);font-size:12px;color:var(--muted);display:block;margin-bottom:2px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:12px;padding:2px 8px;border-radius:5px;border:1px solid var(--line-strong);color:var(--muted)}
.tag.req{border-color:var(--ink);color:var(--ink);font-weight:600}
.details{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0 4px;padding:12px 14px;background:var(--sunk);border-radius:8px;font-size:14px}
.details h4{margin:0 0 4px;font-size:12.5px;color:var(--muted);font-weight:600}
.details p{margin:0;white-space:pre-wrap}
.result-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;margin-top:12px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;align-self:start}
.seg button{border:0;border-left:1px solid var(--line-strong);background:var(--surface);font:600 14px var(--sans);padding:8px 14px;cursor:pointer;color:var(--ink);min-height:40px}
.seg button:first-child{border-left:0}
.seg button:hover{background:var(--sunk)}
.seg button[data-s="pass"][aria-pressed="true"]{background:var(--pass);color:var(--surface)}
.seg button[data-s="fail"][aria-pressed="true"]{background:var(--fail);color:var(--surface)}
.seg button[data-s="na"][aria-pressed="true"]{background:var(--na);color:var(--surface)}
.seg button:disabled{cursor:not-allowed;opacity:.55}
.evidence{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.filebtn{position:relative}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.filebtn:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.meta{font-size:12.5px;color:var(--muted);margin-top:8px}
.banner{padding:10px 12px;border-radius:8px;font-size:14px;margin-top:12px}
.banner.retest{background:var(--retest-soft);color:var(--retest)}
.banner.fail{background:var(--fail-soft);color:var(--fail)}
.locked-msg{padding:28px;border:1px dashed var(--line-strong);border-radius:10px;color:var(--muted)}

.stamp{display:flex;align-items:center;gap:18px;border:2px solid var(--brand);border-radius:12px;padding:16px 20px;background:var(--brand-soft);margin-top:20px;flex-wrap:wrap}
.stamp > div{flex:1;min-width:200px}
.stamp h3{color:var(--brand);font-size:17px}
.stamp p{margin:4px 0 0;font-size:14px}
.seal{width:66px;height:66px;border-radius:50%;border:4px double var(--brand);display:grid;place-items:center;color:var(--brand);transform:rotate(-9deg);flex:none;font:700 10.5px/1.1 var(--sans);text-align:center;letter-spacing:.02em}
@media (prefers-reduced-motion:no-preference){
  .stamp.fresh .seal{animation:stampin .55s cubic-bezier(.2,1.5,.4,1)}
}
@keyframes stampin{from{transform:rotate(-24deg) scale(1.7);opacity:0}to{transform:rotate(-9deg) scale(1);opacity:1}}

/* certificate */
.cert{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;max-width:820px;margin:0 auto}
.cert-in{border:1px solid var(--brand);border-radius:4px;padding:30px 32px}
.cert-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:18px}
.cert h2{font-size:24px}
.cert .stmt{font-size:16px;line-height:1.6;max-width:66ch;margin:0 0 20px}
.cert-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 20px;margin:0 0 22px}
.cert-grid dt{font-size:12.5px;color:var(--muted);font-weight:600}
.cert-grid dd{margin:2px 0 0;font-weight:600}
.sigline{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end;margin-top:22px}
.sigimg{height:70px;background:var(--sig-bg);border-radius:4px;padding:4px 8px;border-bottom:1px solid var(--ink)}
.fingerprint{margin-top:22px;background:var(--sunk);border-radius:8px;padding:12px 14px;font-size:13px}
.fingerprint .mono{word-break:break-all;display:block;margin-top:4px}

/* modal */
.overlay{position:fixed;inset:0;background:var(--overlay);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);color:var(--ink);border-radius:12px;max-width:560px;width:100%;max-height:calc(100% - 24px);overflow:auto;padding:22px 24px;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:900px}
.modal h2{margin-bottom:6px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap}
.stepper{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:4px}
.sigpad{width:100%;height:170px;border:1px dashed var(--line-strong);border-radius:8px;background:var(--sig-bg);touch-action:none;display:block;cursor:crosshair}
.typed-sig{height:120px;display:grid;place-items:center;font-family:var(--hand);font-size:52px;background:var(--sig-bg);color:var(--sig-ink);border:1px dashed var(--line-strong);border-radius:8px;overflow:hidden;white-space:nowrap;padding:0 10px}
.modal img.full{display:block;margin:0 auto;max-height:70vh;border-radius:6px}

/* toast */
#toasts{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);z-index:60;display:grid;gap:8px;width:max-content;max-width:92vw}
.toast{background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.error{background:var(--fail);color:var(--surface)}

@media (max-width:880px){
  .company,.portal{grid-template-columns:1fr}
  .side,.rail{position:static}
  .side-projects{display:none}
  .mainnav{display:flex;gap:6px;overflow-x:auto}
  .mainnav .navbtn{width:auto;white-space:nowrap}
}
@media (max-width:640px){
  .wrap{padding:20px 14px 48px}
  h1{font-size:24px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:nth-child(3){border-left:0}
  .stat:nth-child(n+3){border-top:1px solid var(--line)}
  .grid2,.details{grid-template-columns:1fr}
  .result-row{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr;gap:4px}
  .kv dd{margin-bottom:10px}
  .cred dl{grid-template-columns:1fr}
  .cert-in{padding:20px 18px}
  .cert-grid{grid-template-columns:1fr 1fr}

function rand(n, chars){
  chars = chars || 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const a = new Uint32Array(n); crypto.getRandomValues(a);
  let s=''; for (const x of a) s += chars[x % chars.length]; return s;
}
const uid = p => p + '_' + rand(10, 'abcdefghijkmnpqrstuvwxyz23456789');
function genPassword(){ const c='abcdefghjkmnpqrstuvwxyz23456789'; return rand(4,c)+'-'+rand(4,c)+'-'+rand(4,c); }
async function sha256(data){
  const bytes = typeof data === 'string' ? new TextEncoder().encode(data) : (data instanceof Uint8Array ? data : new Uint8Array(data));
  try{
    const h = await crypto.subtle.digest('SHA-256', bytes);
    return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    let h1 = 0x811c9dc5; for (const b of bytes){ h1 ^= b; h1 = Math.imul(h1, 16777619) >>> 0; }
    return 'fnv1a-' + h1.toString(16);
  }
}
async function setPassword(link, pw){ link.salt = rand(16); link.hash = await sha256(link.salt + ':' + pw); }
async function checkPassword(link, pw){ return (await sha256(link.salt + ':' + pw)) === link.hash; }
function abToB64(buf){ const b=new Uint8Array(buf); let s=''; for(let i=0;i<b.length;i+=0x8000) s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000)); return btoa(s); }
function b64ToU8(b64){ const s=atob(b64); const u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }

const iso = ts => new Date(ts).toISOString().slice(0,10);
function fmt(ts){ if(!ts) return ''; return new Date(ts).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function fmtDate(ts){ if(!ts) return ''; return new Date(ts).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
function rel(ts){
  const d = Date.now() - ts, m = Math.round(d/60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  const h = Math.round(m/60); if (h < 24) return h + ' h ago';
  const dd = Math.round(h/24); if (dd < 14) return dd + (dd===1?' day ago':' days ago');
  return fmtDate(ts);
}

const itemDone = it => it.status === 'pass' || it.status === 'na';
const msComplete = m => m.items.length > 0 && m.items.every(itemDone);
function msState(p, idx){

function projStats(p){
  const items = p.milestones.flatMap(m => m.items);
  return {
    total: items.length,
    done: items.filter(itemDone).length,
    fail: items.filter(i => i.status==='fail').length,

const COLS = [

function rowsFromArrays(arr){
  return arr.map(r => ({order:+r[0], milestone:r[1], code:r[2], title:r[3], steps:r[4], expected:r[5], mandatory:r[6]==='Y', evidence:r[7]==='Y'}));

function buildMilestones(rows){
  const byOrder = new Map();
  for (const r of rows){
    if (!byOrder.has(r.order)) byOrder.set(r.order, {id:uid('ms'), order:r.order, name:r.milestone, items:[]});
    byOrder.get(r.order).items.push({
      id:uid('it'), code:r.code, title:r.title, steps:r.steps||'', expected:r.expected||'',
      mandatory:!!r.mandatory, evidence:!!r.evidence,
      status:null, comment:'', image:null, testedBy:null, testedByEmail:null, testedAt:null, fixNote:'', history:[]
    });
  }
  return Array.from(byOrder.values()).sort((a,b) => a.order - b.order);
}
function parseCSV(text){
  text = text.replace(/^\uFEFF/, '');
  const rows=[]; let row=[], f='', q=false;
  for (let i=0;i<text.length;i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; }
      else f += c;
    } else {
      if (c === '"') q = true;
      else if (c === ',' ){ row.push(f); f=''; }
      else if (c === '\n'){ row.push(f); rows.push(row); row=[]; f=''; }
      else if (c === '\r'){ /* skip */ }
      else f += c;
    }
  }
  if (f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows;
}
function validateMatrix(matrix){
  const errors = [];
  const isBlank = r => !r || r.every(c => String(c == null ? '' : c).trim() === '');
  let h = matrix.findIndex(r => !isBlank(r));
  if (h < 0) return {rows:[], errors:['The file is empty. Download the template to see the expected layout.']};
  const header = matrix[h].map(norm);
  const idx = {};
  for (const [key,, aliases] of COLS){
    const i = header.findIndex(x => aliases.includes(x));
    if (i >= 0) idx[key] = i;
  }
  const missing = COLS.filter(c => REQUIRED_COLS.includes(c[0]) && idx[c[0]] == null).map(c => '“' + c[1] + '”');
  if (missing.length) return {rows:[], errors:['Missing column' + (missing.length>1?'s ':' ') + missing.join(', ') + '. Download the template to see the expected columns.']};
  const rows = []; const codes = new Map(); const nameByOrder = new Map(); const orderByName = new Map();
  const yn = (v, def, rowNum, label) => {
    const s = String(v == null ? '' : v).trim().toLowerCase();
    if (s === '') return def;
    if (['y','yes','true','1'].includes(s)) return true;
    if (['n','no','false','0'].includes(s)) return false;
    errors.push(`Row ${rowNum}: “${label}” must be Y or N, not “${v}”.`); return def;
  };
  for (let r = h+1; r < matrix.length; r++){
    const row = matrix[r]; if (isBlank(row)) continue;
    const rowNum = r + 1;
    const get = k => idx[k] == null ? '' : String(row[idx[k]] == null ? '' : row[idx[k]]).trim();
    const orderRaw = get('order'), order = Number(orderRaw);
    const milestone = get('milestone'), code = get('code'), title = get('title');
    if (!orderRaw || !Number.isInteger(order) || order < 1) errors.push(`Row ${rowNum}: Milestone order must be a whole number like 1, 2 or 3${orderRaw ? `, not “${orderRaw}”` : ''}.`);
    if (!milestone) errors.push(`Row ${rowNum}: Milestone name is empty.`);
    if (!code) errors.push(`Row ${rowNum}: Item ID is empty.`);
    else if (codes.has(code.toLowerCase())) errors.push(`Row ${rowNum}: Item ID “${code}” is already used on row ${codes.get(code.toLowerCase())}.`);
    else codes.set(code.toLowerCase(), rowNum);
    if (!title) errors.push(`Row ${rowNum}: Title is empty.`);
    if (Number.isInteger(order) && milestone){
      if (nameByOrder.has(order) && nameByOrder.get(order).toLowerCase() !== milestone.toLowerCase())
        errors.push(`Row ${rowNum}: Milestone ${order} is called “${nameByOrder.get(order)}” on an earlier row but “${milestone}” here.`);
      else if (!nameByOrder.has(order)) nameByOrder.set(order, milestone);
      const k = milestone.toLowerCase();
      if (orderByName.has(k) && orderByName.get(k) !== order)
        errors.push(`Row ${rowNum}: “${milestone}” appears with two different milestone orders.`);
      else orderByName.set(k, order);
    }
    rows.push({order, milestone, code, title, steps:get('steps'), expected:get('expected'),
      mandatory: yn(idx.mandatory == null ? '' : row[idx.mandatory], true, rowNum, 'Mandatory'),
      evidence: yn(idx.evidence == null ? '' : row[idx.evidence], false, rowNum, 'Evidence required')});
  }
  if (!rows.length && !errors.length) errors.push('No checklist items were found under the header row.');
  return {rows: errors.length ? [] : rows, errors};
}

/* ---------- downloads ---------- */
function downloadBlob(filename, data, mime){
  const blob = data instanceof Blob ? data : new Blob([data], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.style.display = 'none';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Saved ' + filename);
}
async function downloadTemplate(){
  const header = COLS.map(c => c[1]);
  const body = SAMPLE_ROWS.map(r => r.slice());
  if (window.XLSX){
    try{
      const ws = XLSX.utils.aoa_to_sheet([header].concat(body));
      ws['!cols'] = [{wch:16},{wch:24},{wch:10},{wch:34},{wch:50},{wch:50},{wch:16},{wch:22}];
      const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'UAT checklist');
      const out = XLSX.write(wb, {bookType:'xlsx', type:'array'});
      downloadBlob('uat-checklist-template.xlsx', out, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
      return;
    }catch(e){ /* fall through to CSV */ }
  }
  const csvCell = v => { const s = String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const csv = [header].concat(body).map(r => r.map(csvCell).join(',')).join('\n');
  downloadBlob('uat-checklist-template.csv', csv, 'text/csv;charset=utf-8');
}
function exportWorkspace(){
  const payload = {v:1, exportedAt: new Date().toISOString(), data: S};
  downloadBlob('uat-desk-workspace-backup.json', JSON.stringify(payload, null, 2), 'application/json;charset=utf-8');
}
function importWorkspace(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const payload = JSON.parse(fr.result);
      const data = payload && payload.data ? payload.data : payload;
      if (!data || !Array.isArray(data.projects) || !Array.isArray(data.clients) || !Array.isArray(data.products)) throw new Error('shape');
      S = data; save(); render();
      UI.route = {page:'dashboard'}; UI.filterClient = 'all';
      toast('Workspace restored from backup');
    }catch(e){ toast('Couldn’t import that file. It doesn’t look like a UAT Desk backup.', 'error'); }
  };
  fr.onerror = () => toast('Couldn’t read the file.', 'error');
  fr.readAsText(file);
}

  log(p1, 'Rahul Mehta', 'Created the project and generated the client link', now - 6*DAY);

  p1.testers.push(tester);
  log(p1, tester.name, 'Opened the checklist', now - 5*DAY);
  const mark = (code, status, at, extra) => {
    const it = p1.milestones.flatMap(m => m.items).find(i => i.code === code);
    Object.assign(it, {status, testedBy:tester.name, testedByEmail:tester.email, testedAt:at}, extra || {});
    it.history.push({at, by:tester.name, status, comment:it.comment});
    log(p1, tester.name, (ITEM_META[status][0]) + ' ' + code, at);
  };
  mark('AR-01','pass', now - 5*DAY);
  mark('AR-02','pass', now - 5*DAY + 3600e3, {image:SEED_SHOT, comment:'Billing menu hidden as expected.'});
  mark('AR-03','na', now - 5*DAY + 5400e3, {comment:'We only use SSO, so password reset does not apply.'});
  mark('SW-01','pass', now - 2*DAY);
  mark('SW-02','fail', now - 2*DAY + 1800e3, {comment:'Mumbai went up by 10 but Pune still shows 120 units after approval.'});

  const p2 = await makeProject({productId:pFs.id, clientId:cNw.id, version:'v1.0', owner:'Anita Desai', linkId:'UAT-NWFS10',
    expiresAt: iso(now + 30*DAY), rows: rowsFromArrays(FS_ROWS), createdAt: now - 1*DAY}, 'northwind-fs-01');
  s.projects.push(p2);
  s.demoCreds.push({projectId:p2.id, linkId:'UAT-NWFS10', password:'northwind-fs-01'});
  log(p2, 'Anita Desai', 'Created the project and generated the client link', now - 1*DAY);
  return s;
}

function drawStrokes(ctx, strokes, W, H, color, lw){
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const s of strokes){
    if (!s.length) continue;
    ctx.beginPath(); ctx.moveTo(s[0][0]*W, s[0][1]*H);
    if (s.length === 1) ctx.lineTo(s[0][0]*W + 0.5, s[0][1]*H + 0.5);
    for (let i=1;i<s.length;i++) ctx.lineTo(s[i][0]*W, s[i][1]*H);
    ctx.stroke();
  }
}
function initSigPad(){
  const cv = document.getElementById('sigpad'); if (!cv) return;
  const g = UI.sign; const dpr = window.devicePixelRatio || 1;
  const rect = cv.getBoundingClientRect(); const W = rect.width, H = rect.height;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  g.aspect = W / H;
  const redraw = () => { ctx.clearRect(0,0,W,H); drawStrokes(ctx, g.strokes, W, H, '#1A2A5A', 2.4); };
  redraw();
  let cur = null;
  const pt = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left)/r.width, (e.clientY - r.top)/r.height]; };
  cv.addEventListener('pointerdown', e => { e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(_){} cur = [pt(e)]; g.strokes.push(cur); redraw(); });
  cv.addEventListener('pointermove', e => { if (!cur) return; cur.push(pt(e)); redraw(); });
  const end = () => { cur = null; };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end); cv.addEventListener('pointerleave', end);
}
async function exportSignature(){
  const g = UI.sign; const H = 240;
  if (g.mode === 'draw'){
    const W = Math.round(H * (g.aspect || 3));
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    drawStrokes(cv.getContext('2d'), g.strokes, W, H, '#1A2A5A', 4.5);
    return {data: cv.toDataURL('image/png'), aspect: W/H};
  }
  const text = (g.typed || g.name).trim();
  try{ await document.fonts.load('110px Caveat'); }catch(e){}
  const W = 900; const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d'); let size = 120;
  ctx.font = `500 ${size}px Caveat, "Segoe Script", cursive`;
  while (ctx.measureText(text).width > W - 40 && size > 40){ size -= 6; ctx.font = `500 ${size}px Caveat, "Segoe Script", cursive`; }
  ctx.fillStyle = '#1A2A5A'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, W/2, H/2 + 6);
  return {data: cv.toDataURL('image/png'), aspect: W/H};
}

/* ---------- PDF certificate ---------- */
function buildCertificatePDF(p){
  const J = window.jspdf && window.jspdf.jsPDF; if (!J) return null;
  const so = p.signoff; const doc = new J({unit:'mm', format:'a4', compress:true});
  const W = 210, M = 18; let y;
  doc.setProperties({title:'UAT Completion Certificate ' + so.verificationId, subject: productName(p) + ' ' + p.version, author: p.owner});
  doc.setFillColor(30,91,74); doc.rect(0,0,W,30,'F');
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(18);
  doc.text('UAT Completion Certificate', M, 14);
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  doc.text('Verification ID: ' + so.verificationId, M, 22);
  doc.text('Signed ' + fmt(so.signedAt), W - M, 22, {align:'right'});
  y = 42; doc.setTextColor(22,32,27); doc.setFontSize(11.5);
  const s = projStats(p);
  const stmt = `This certifies that ${clientName(p)} has completed user acceptance testing of ${productName(p)} ${p.version} and accepts it as meeting the agreed UAT checklist of ${s.total} items across ${p.milestones.length} milestones.`;
  const lines = doc.splitTextToSize(stmt, W - 2*M); doc.text(lines, M, y); y += lines.length * 5.6 + 6;
  const det = [['Client', clientName(p)], ['Product', productName(p) + ' ' + p.version], ['Project ID', p.link.id], ['Company contact', p.owner], ['UAT opened', fmtDate(p.createdAt)], ['Signed on', fmt(so.signedAt)]];
  det.forEach((d, i) => {
    const x = M + (i % 3) * 60, yy = y + Math.floor(i/3) * 13;
    doc.setFontSize(8.5); doc.setTextColor(93,103,98); doc.text(d[0], x, yy);
    doc.setFontSize(10.5); doc.setTextColor(22,32,27); doc.setFont('helvetica','bold');
    doc.text(doc.splitTextToSize(String(d[1]), 56)[0], x, yy + 5); doc.setFont('helvetica','normal');
  });
  y += 2*13 + 6;
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.text('Milestones', M, y); y += 4;
  const cols = [M, M+88, M+108, M+128, M+152];
  doc.setFillColor(233,236,231); doc.rect(M, y, W-2*M, 8, 'F');
  doc.setFontSize(9); doc.setTextColor(93,103,98);
  ['Milestone','Items','Passed','Not applicable','Completed'].forEach((h,i) => doc.text(h, cols[i]+2, y+5.4));
  y += 8; doc.setFont('helvetica','normal'); doc.setTextColor(22,32,27); doc.setFontSize(10);
  so.summary.forEach((m, i) => {
    if (y > 260){ doc.addPage(); y = 20; }
    doc.text(doc.splitTextToSize((i+1) + '. ' + m.name, 84)[0], cols[0]+2, y+5.6);
    doc.text(String(m.total), cols[1]+2, y+5.6); doc.text(String(m.pass), cols[2]+2, y+5.6);
    doc.text(String(m.na), cols[3]+2, y+5.6); doc.text(fmtDate(m.completedAt), cols[4]+2, y+5.6);
    doc.setDrawColor(214,219,212); doc.line(M, y+8, W-M, y+8); y += 8;
  });
  y += 6; doc.setFontSize(9.5); doc.setTextColor(93,103,98);
  doc.text(doc.splitTextToSize('Tested by: ' + (so.testers.map(t => t.name).join(', ') || 'client team'), W-2*M), M, y);
  y += 12; if (y > 220){ doc.addPage(); y = 24; }
  doc.setTextColor(93,103,98); doc.setFontSize(9); doc.text('Signed for ' + clientName(p), M, y); y += 2;
  const sigW = Math.min(70, 22 * (so.sigAspect || 3)), sigH = sigW / (so.sigAspect || 3);
  try{ doc.addImage(so.signature, 'PNG', M, y, sigW, sigH); }catch(e){}
  y += sigH + 1; doc.setDrawColor(22,32,27); doc.line(M, y, M+80, y); y += 5;
  doc.setTextColor(22,32,27); doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text(so.signer.name, M, y);
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); y += 5;
  doc.text(so.signer.designation + ', ' + clientName(p), M, y); y += 4.6;
  doc.text(so.signer.email, M, y); y += 4.6;
  doc.setTextColor(93,103,98); doc.text('Email verified by one-time code on ' + fmt(so.otpVerifiedAt), M, y); y += 10;
  doc.setFillColor(233,236,231); doc.rect(M, y, W-2*M, 22, 'F');
  doc.setTextColor(22,32,27); doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.text('Record fingerprint (SHA-256)', M+4, y+6);
  doc.setFont('courier','normal'); doc.setFontSize(8.5); doc.text(so.recordHash, M+4, y+11.5);
  doc.setFont('helvetica','normal'); doc.setTextColor(93,103,98); doc.setFontSize(8.5);
  doc.text('IP address and device are captured by the server in the production build.', M+4, y+17);
  doc.setFontSize(8.5);
  doc.text('Check this certificate at uat.yourcompany.com/verify using the verification ID above.', W/2, 287, {align:'center'});
  return doc.output('arraybuffer');
}
async function downloadCert(p){
  const so = p.signoff; if (!so) return;
  let data = null;
  if (so.pdfB64) data = b64ToU8(so.pdfB64);
  else { const buf = buildCertificatePDF(p); if (buf) data = new Uint8Array(buf); }
  if (!data){ toast('The PDF library didn’t load. Check your connection and reload the page.', 'error'); return; }
  const name = ('UAT-certificate-' + clientName(p) + '-' + productName(p) + '-' + p.version).replace(/[^A-Za-z0-9.-]+/g,'-') + '.pdf';
  downloadBlob(name, data, 'application/pdf');
}

async function createProject(){
  const d = UI.draft; const errs = [];
  if (d.productId === '__new' && !d.newProduct.trim()) errs.push('Enter a name for the new product.');
  if (d.clientId === '__new' && !d.newClient.trim()) errs.push('Enter a name for the new client.');
  if (!d.owner.trim()) errs.push('Enter the company contact’s name.');
  if (!d.version.trim()) errs.push('Enter a release or version, such as v1.0.');
  if (!d.expiry) errs.push('Choose how long the link stays available.');
  else if (new Date(d.expiry + 'T23:59:59').getTime() < Date.now()) errs.push('The link’s end date is in the past.');
  if (!d.rows) errs.push('Upload a valid checklist.');
  d.formErrors = errs;
  if (errs.length){ render(); window.scrollTo({top:0}); return; }
  const findOrAdd = (list, name, prefix) => {
    const n = name.trim(); const ex = list.find(x => x.name.toLowerCase() === n.toLowerCase());
    if (ex) return ex.id; const it = {id:uid(prefix), name:n}; list.push(it); return it.id;
  };
  const productId = d.productId === '__new' ? findOrAdd(S.products, d.newProduct, 'prd') : d.productId;
  const clientId = d.clientId === '__new' ? findOrAdd(S.clients, d.newClient, 'cli') : d.clientId;
  const pw = genPassword();
  let linkId; do { linkId = 'UAT-' + rand(6); } while (S.projects.some(p => p.link.id === linkId));
  const p = await makeProject({productId, clientId, version:d.version.trim(), owner:d.owner.trim(), linkId, expiresAt:d.expiry, rows:d.rows}, pw);
  S.projects.push(p); S.lastOwner = p.owner;
  log(p, p.owner, 'Created the project and generated the client link');
  save();
  UI.justCreated = {projectId:p.id, password:pw}; UI.draft = null;
  UI.route = {page:'project', projectId:p.id}; render(); window.scrollTo({top:0});
  toast('Project created');
}
async function handleChecklistFile(file){
  const d = UI.draft; d.fileName = file.name; d.rows = null; d.fileErrors = []; d.formErrors = [];
  try{
    let matrix;
    if (/\.csv$/i.test(file.name)) matrix = parseCSV(await file.text());
    else {
      if (!window.XLSX){ d.fileErrors = ['Excel files need the spreadsheet library, which didn’t load. Save the sheet as CSV and upload that instead.']; render(); return; }
      const wb = XLSX.read(await file.arrayBuffer(), {type:'array'});
      matrix = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:'', raw:false});
    }
    const r = validateMatrix(matrix);
    d.rows = r.errors.length ? null : r.rows; d.fileErrors = r.errors;
  }catch(e){ d.fileErrors = ['This file couldn’t be read. Upload an .xlsx or .csv file based on the template.']; }
  render();
}
function readImage(file){
  return new Promise((res, rej) => {
    if (!file.type.startsWith('image/')) return rej(new Error('type'));
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 1100; let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        const k = Math.min(1, max / Math.max(w, h)); w = Math.max(1, Math.round(w*k)); h = Math.max(1, Math.round(h*k));
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h); ctx.drawImage(img, 0, 0, w, h);
        res(cv.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
function captureComments(){
  document.querySelectorAll('[data-comment]').forEach(ta => {
    const p = proj(UI.client.projectId); if (!p) return;
    const {it} = findItem(p, ta.dataset.comment); if (it) it.comment = ta.value;
  });
}
function setStatus(iid, s){
  const p = proj(UI.client.projectId); if (!p || p.signoff) return;
  const {m, it, mi} = findItem(p, iid); if (!it || msState(p, mi) === 'locked') return;
  captureComments(); delete UI.errors[iid];
  const t = UI.client.tester; const before = msComplete(m);
  if (it.status === s){
    it.status = null; it.testedBy = null; it.testedAt = null;
    it.history.push({at:Date.now(), by:t.name, status:null, comment:it.comment});
    log(p, t.name, 'Cleared the result for ' + it.code);
  } else {
    if (s === 'fail' && !it.comment.trim()){ UI.errors[iid] = 'Describe what went wrong in the comment box, then mark Fail.'; save(); render(); const ta = document.getElementById('c-' + iid); if (ta) ta.focus(); return; }
    if (s === 'na' && it.mandatory) return;
    it.status = s; it.testedBy = t.name; it.testedByEmail = t.email; it.testedAt = Date.now();
    it.history.push({at:it.testedAt, by:t.name, status:s, comment:it.comment});
    log(p, t.name, ITEM_META[s][0] + ' ' + it.code + (s === 'fail' ? ': ' + it.comment : ''));
    if (itemDone(it)) UI.expanded[iid] = false;
  }
  if (!before && msComplete(m)){ UI.freshStamp = m.id; toast('Milestone complete: ' + m.name); }
  save(); render();
}
async function submitSignoff(){
  const p = proj(UI.client.projectId); const g = UI.sign;
  g.consent = !!(document.getElementById('s-consent') || {}).checked;
  if (g.mode === 'type'){ const inp = document.getElementById('s-typed'); if (inp) g.typed = inp.value; }
  if (g.mode === 'draw' && !g.strokes.some(s => s.length > 1)){ g.error = 'Draw your signature in the box.'; renderSignModal(); return; }
  if (g.mode === 'type' && !(g.typed || '').trim()){ g.error = 'Type your full name to sign.'; renderSignModal(); return; }
  if (!g.consent){ g.error = 'Tick the confirmation box to sign.'; renderSignModal(); return; }
  const btn = document.getElementById('sign-submit'); if (btn){ btn.disabled = true; btn.textContent = 'Signing…'; }
  const sig = await exportSignature();
  const signedAt = Date.now();
  let verificationId; do { verificationId = 'VC-' + rand(4) + '-' + rand(4); } while (S.projects.some(x => x.signoff && x.signoff.verificationId === verificationId));
  const summary = p.milestones.map(m => ({name:m.name, total:m.items.length, pass:m.items.filter(i => i.status==='pass').length, na:m.items.filter(i => i.status==='na').length, completedAt:Math.max.apply(null, m.items.map(i => i.testedAt || 0))}));
  const seen = new Set(); const testers = p.testers.filter(t => { const k = t.name.trim().toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; });
  const signer = {name:g.name.trim(), designation:g.designation.trim(), email:g.email.trim()};
  const record = {projectId:p.link.id, product:productName(p), version:p.version, client:clientName(p), owner:p.owner,
    milestones:p.milestones.map(m => ({name:m.name, items:m.items.map(i => ({code:i.code, status:i.status, by:i.testedBy, at:i.testedAt}))})),
    signer, otpVerifiedAt:g.otpVerifiedAt, signedAt, verificationId};
  const recordHash = await sha256(JSON.stringify(record));
  p.signoff = {verificationId, signedAt, signer, otpVerifiedAt:g.otpVerifiedAt, signature:sig.data, sigAspect:sig.aspect, summary, testers, recordHash, pdfB64:null, pdfHash:null};
  const buf = buildCertificatePDF(p);
  if (buf){ const u8 = new Uint8Array(buf); p.signoff.pdfHash = await sha256(u8); p.signoff.pdfB64 = abToB64(u8); }
  log(p, signer.name, 'Signed off UAT (' + verificationId + ')');
  if (!save()){ p.signoff.pdfB64 = null; p.signoff.pdfHash = null; save(); }
  UI.sign = null; closeModal(); render(); window.scrollTo({top:0});
  toast('UAT signed off');
}

document.addEventListener('click', async e => {
  if (e.target.matches('[data-overlay]')){ closeModal(); return; }
  const el = e.target.closest('[data-action]'); if (!el) return;
  const a = el.dataset.action; const pid = el.dataset.pid; const p = pid ? proj(pid) : null;
  switch (a){
    case 'view':
      UI.view = el.dataset.view; render(); window.scrollTo({top:0}); break;
    case 'toggle-theme': toggleTheme(); break;
    case 'reset-demo':
      openModal(`<h2>Reset the demo?</h2><p>This deletes every project, result and certificate saved in this browser and restores the two sample projects.</p><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">Cancel</button><button type="button" class="btn primary" data-action="confirm-reset">Reset demo</button></div>`); break;
    case 'confirm-reset':
      try{ localStorage.removeItem(STORE_KEY); }catch(_){}
      S = await seed(); save();
      Object.assign(UI, {route:{page:'dashboard'}, filterClient:'all', justCreated:null, draft:null, verify:{id:'',projectId:null,notFound:false,fileCheck:null}, errors:{}, expanded:{}, sign:null});
      UI.client = {projectId:null, tester:null, milestoneId:null, prefillId:'', loginError:'', attempts:{}, lockUntil:{}};
      UI.testers = {}; closeModal(); render(); toast('Demo reset'); break;
    case 'nav':
      UI.route = {page: el.dataset.page};
      if (el.dataset.page === 'new' && !UI.draft) UI.draft = newDraft();
      if (el.dataset.page === 'verify') UI.verify = {id:'', projectId:null, notFound:false, fileCheck:null};
      render(); window.scrollTo({top:0}); break;
    case 'open-project':
      if (e.target.closest('button') && e.target.closest('button') !== el && e.target.closest('button').dataset.action !== 'open-project') return;
      UI.route = {page:'project', projectId:pid}; render(); window.scrollTo({top:0}); break;
    case 'copy': copyText(el.dataset.text); break;
    case 'copy-invite':
      if (UI.justCreated && UI.justCreated.projectId === pid) copyText(inviteText(p, UI.justCreated.password), 'Invite message copied'); break;
    case 'dismiss-cred': UI.justCreated = null; render(); break;
    case 'regen-pw':
      openModal(`<h2>Generate a new password?</h2><p>The current password stops working straight away. Anyone testing will need the new one to sign in again.</p><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">Cancel</button><button type="button" class="btn primary" data-action="confirm-regen" data-pid="${pid}">Generate new password</button></div>`); break;
    case 'confirm-regen': {
      const pw = genPassword(); await setPassword(p.link, pw);
      log(p, p.owner, 'Generated a new client password'); save();
      UI.justCreated = {projectId:p.id, password:pw};
      if (UI.client.projectId === p.id){ UI.client.projectId = null; UI.client.tester = null; }
      closeModal(); render(); window.scrollTo({top:0}); toast('New password generated'); break; }
    case 'toggle-access':
      p.link.revoked = !p.link.revoked; log(p, p.owner, p.link.revoked ? 'Turned off client access' : 'Turned client access back on'); save(); render(); break;
    case 'open-client-login':
      UI.view = 'client'; UI.client.projectId = null; UI.client.tester = null; UI.client.prefillId = p.link.id; UI.client.loginError = '';
      render(); window.scrollTo({top:0}); { const pw = document.getElementById('l-pw'); if (pw) pw.focus(); } break;
    case 'mark-fixed': {
      const {it} = findItem(p, el.dataset.iid);
      openModal(`<h2>Mark ${esc(it.code)} as fixed</h2><p class="hint">The client sees this note and is asked to test the item again.</p>
        <div class="field" style="margin-top:12px"><label class="lbl" for="fix-note">What was fixed?</label><textarea id="fix-note" placeholder="e.g. Source warehouse now updates when a transfer is approved."></textarea></div>
        <div class="modal-actions"><button type="button" class="btn" data-action="close-modal">Cancel</button><button type="button" class="btn primary" data-action="confirm-fixed" data-pid="${pid}" data-iid="${it.id}">Send for retest</button></div>`); break; }
    case 'confirm-fixed': {
      const {it} = findItem(p, el.dataset.iid); const note = (document.getElementById('fix-note') || {}).value || '';
      it.status = 'retest'; it.fixNote = note.trim();
      it.history.push({at:Date.now(), by:p.owner, status:'retest', comment:note});
      log(p, p.owner, 'Marked ' + it.code + ' fixed and ready for retest'); save(); closeModal(); render(); toast(it.code + ' sent for retest'); break; }
    case 'view-image': {
      const {it} = findItem(p, el.dataset.iid);
      openModal(`<h2>${esc(it.code)}: ${esc(it.title)}</h2><img class="full" src="${it.image}" alt="Screenshot for ${esc(it.code)}"><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">Close</button></div>`, true); break; }
    case 'download-template': downloadTemplate(); break;
    case 'use-sample':
      UI.draft.rows = rowsFromArrays(SAMPLE_ROWS); UI.draft.fileErrors = []; UI.draft.fileName = 'Sample checklist'; render(); break;
    case 'create-project': createProject(); break;
    case 'download-cert': downloadCert(p); break;
    case 'export-data': exportWorkspace(); break;
    case 'print-cert': window.print(); break;
    case 'view-cert':
      openModal(certHTML(p) + `<div class="modal-actions"><button type="button" class="btn" data-action="close-modal">Close</button><button type="button" class="btn primary" data-action="download-cert" data-pid="${pid}">Download PDF</button></div>`, true); break;
    case 'close-modal': closeModal(); break;
    /* client */
    case 'demo-fill':
      UI.client.prefillId = el.dataset.id;
      { const i = document.getElementById('l-id'), pw = document.getElementById('l-pw'); if (i) i.value = el.dataset.id; if (pw){ pw.value = el.dataset.pw; } }
      break;
    case 'import-data': document.getElementById('import-file')?.click(); break;
    case 'client-signout':
      UI.client.projectId = null; UI.client.tester = null; UI.client.milestoneId = null; UI.client.loginError = ''; render(); break;
    case 'client-ms':
      if (el.disabled) return; captureComments(); save();
      UI.client.milestoneId = el.dataset.mid; render(); window.scrollTo({top:0}); break;
    case 'set-status': setStatus(el.dataset.iid, el.dataset.s); break;
    case 'toggle-details': {
      captureComments(); const pp = proj(UI.client.projectId); const {it} = findItem(pp, el.dataset.iid);
      const cur = UI.expanded[it.id] != null ? UI.expanded[it.id] : !itemDone(it);
      UI.expanded[it.id] = !cur; render(); break; }
    case 'remove-image': {
      const pp = proj(UI.client.projectId); const {it} = findItem(pp, el.dataset.iid);
      captureComments(); it.image = null;
      delete UI.errors[it.id];
      save(); render(); break; }
    case 'start-signoff': {
      const pp = proj(UI.client.projectId); const t = UI.client.tester;
      if (!UI.sign) UI.sign = {step:1, name:t ? t.name : '', designation:'', email:t ? t.email : '', otp:'', otpInput:'', otpVerifiedAt:null, mode:'draw', strokes:[], typed:'', consent:false, error:''};
      UI.sign.error = ''; if (pp) renderSignModal(); break; }
    case 'sign-next': {
      const g = UI.sign;
      if (!g.name.trim()) g.error = 'Enter the signer’s full name.';
      else if (!g.designation.trim()) g.error = 'Enter the signer’s designation.';
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(g.email.trim())) g.error = 'Enter a valid work email address.';
      else { g.error = ''; g.otp = rand(6, '0123456789'); g.otpInput = ''; g.step = 2; }
      renderSignModal(); break; }
    case 'sign-resend': UI.sign.otp = rand(6, '0123456789'); UI.sign.otpInput = ''; UI.sign.error = ''; renderSignModal(); toast('New code sent'); break;
    case 'sign-back': UI.sign.step = 1; UI.sign.error = ''; renderSignModal(); break;
    case 'sign-verify': {
      const g = UI.sign;
      if (g.otpInput.trim() === g.otp){ g.otpVerifiedAt = Date.now(); g.step = 3; g.error = ''; if (!g.typed) g.typed = g.name; }
      else g.error = 'That code doesn’t match. Check the email or send a new code.';
      renderSignModal(); break; }
    case 'sig-mode': {
      const g = UI.sign; g.consent = !!(document.getElementById('s-consent') || {}).checked;
      const inp = document.getElementById('s-typed'); if (inp) g.typed = inp.value;
      g.mode = el.dataset.mode; g.error = ''; renderSignModal(); break; }
    case 'sig-clear': UI.sign.strokes = []; UI.sign.consent = !!(document.getElementById('s-consent') || {}).checked; renderSignModal(); break;
    case 'sign-submit': submitSignoff(); break;
  }
});

document.addEventListener('submit', async e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  const kind = f.dataset.form;
  if (kind === 'login'){
    const c = UI.client; const id = document.getElementById('l-id').value.trim().toUpperCase(); const pw = document.getElementById('l-pw').value;
    c.prefillId = id;
    const lock = c.lockUntil[id] || 0;
    if (Date.now() < lock){ c.loginError = `Too many attempts. Try again in ${Math.ceil((lock - Date.now())/1000)} seconds.`; render(); return; }
    const p = S.projects.find(x => x.link.id === id);
    if (!id || !pw){ c.loginError = 'Enter both the project ID and the password.'; render(); return; }
    if (!p || !(await checkPassword(p.link, pw))){
      c.attempts[id] = (c.attempts[id] || 0) + 1;
      if (p) { log(p, 'Unknown visitor', 'Failed sign-in attempt'); save(); }
      if (c.attempts[id] >= 5){ c.lockUntil[id] = Date.now() + 60000; c.attempts[id] = 0; c.loginError = 'Too many attempts. Try again in 60 seconds.'; }
      else c.loginError = 'That project ID and password don’t match. Check the details in your invitation email.';
      render(); const pwi = document.getElementById('l-pw'); if (pwi) pwi.focus(); return;
    }
    c.attempts[id] = 0; c.loginError = ''; c.projectId = p.id; c.milestoneId = null;
    c.tester = UI.testers[p.id] || null;
    render(); window.scrollTo({top:0});
  } else if (kind === 'tester'){
    const name = document.getElementById('t-name').value.trim(), email = document.getElementById('t-email').value.trim();
    if (!name || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ UI.errors.tester = 'Enter your name and a valid work email.'; render(); return; }
    delete UI.errors.tester;
    const p = proj(UI.client.projectId); const t = {name, email};
    UI.client.tester = t; UI.testers[p.id] = t;
    if (!p.testers.some(x => x.email.toLowerCase() === email.toLowerCase())) p.testers.push(t);
    log(p, name, 'Opened the checklist'); save(); render();
  } else if (kind === 'verify'){
    const id = document.getElementById('v-id').value.trim().toUpperCase();
    const p = S.projects.find(x => x.signoff && x.signoff.verificationId === id);
    UI.verify = {id, projectId: p ? p.id : null, notFound: !p && !!id, fileCheck:null}; render();
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.draft && UI.draft && t.tagName !== 'SELECT'){ UI.draft[t.dataset.draft] = t.value; return; }
  if (t.dataset.sign && UI.sign){
    UI.sign[t.dataset.sign] = t.value;
    if (t.dataset.sign === 'typed'){ const pv = document.getElementById('typed-preview'); if (pv) pv.textContent = t.value; }
  }
});

document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.draft && UI.draft && t.tagName === 'SELECT'){ UI.draft[t.dataset.draft] = t.value; render(); return; }
  if (t.dataset.field === 'filter'){ UI.filterClient = t.value; render(); return; }
  if (t.dataset.field === 'expiry'){
    const p = proj(t.dataset.pid); if (!p || !t.value) return;
    p.link.expiresAt = t.value; log(p, p.owner, 'Changed the link end date to ' + fmtDate(new Date(t.value + 'T12:00:00').getTime())); save(); render(); toast('End date updated'); return;
  }
  if (t.id === 'checklist-file' && t.files && t.files[0]){ handleChecklistFile(t.files[0]); return; }
  if (t.id === 'import-file' && t.files && t.files[0]){ importWorkspace(t.files[0]); t.value = ''; return; }
  if (t.dataset.comment){
    const p = proj(UI.client.projectId); if (!p) return;
    const {it} = findItem(p, t.dataset.comment); if (it){ it.comment = t.value; if (UI.errors[it.id] && it.comment.trim()) { delete UI.errors[it.id]; } save(); }
    return;
  }
  if (t.dataset.evidence && t.files && t.files[0]){
    const p = proj(UI.client.projectId); const {it} = findItem(p, t.dataset.evidence);
    captureComments();
    try{ it.image = await readImage(t.files[0]); delete UI.errors[it.id]; log(p, UI.client.tester.name, 'Attached a screenshot to ' + it.code); }
    catch(err){ UI.errors[it.id] = 'That file isn’t an image we can read. Attach a PNG or JPG screenshot.'; }
    if (!save()){ it.image = null; }
    render(); return;
  }
  if (t.id === 'verify-pdf' && t.files && t.files[0]){
    const p = proj(UI.verify.projectId); if (!p) return;
    if (!p.signoff.pdfHash){ UI.verify.fileCheck = 'none'; render(); return; }
    const h = await sha256(new Uint8Array(await t.files[0].arrayBuffer()));
    UI.verify.fileCheck = h === p.signoff.pdfHash; render(); return;
  }
});

document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalRoot.innerHTML) closeModal(); });

/* ---------- start ---------- */
(async function init(){
  storageOK = probeStorage();
  applyTheme();
  S = load();
  if (!S || S.v !== 1){ S = await seed(); save(); }
  render();
  if (!storageOK) toast('This browser blocks saving, so changes last only until you reload.');
})();
})();
